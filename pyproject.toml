[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rulesentry-ai"
version = "0.1.0"
description = "AI-assisted Sigma detection rule validation and testing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Adarsh Sreekumar" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["rulesentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
